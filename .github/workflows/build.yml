name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder Android
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --project-name catatan_kas --org id.catatankas .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Catatan Kas"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: catatan-kas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
